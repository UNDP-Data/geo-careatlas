apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-oauth-route
  namespace: auth                 # <-- Belongs in the auth namespace
spec:
  parentRefs:
  - name: cluster-gateway
    namespace: default            # Attaches to the shared Gateway in default
  hostnames:
  - "auth.undpgeohub.org"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: github-oauth-oauth2-proxy
      port: 80