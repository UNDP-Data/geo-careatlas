services:
  api:
    build:
      context: .
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    container_name: careatlas
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - ./src:/server/src
      # Content repository clone and editors' uncommitted work
      - careatlas-data:/data
    ports:
      - "8080:8001"
    command: uv run uvicorn careatlas.app.server:app --host 0.0.0.0 --port 8001 --reload --reload-dir /server/src/careatlas/app
    env_file:
      - .env
    environment:
      - NICEGUI_STORAGE_SECRET=${OAUTH_COOKIE_KEY}
      - AUTH_INTERNAL_URL=http://auth-proxy:4180/oauth2
      - AUTH_PUBLIC_URL=http://localhost:4180/oauth2
      - PUBLIC_URL=http://localhost:8080
      - FORWARDED_ALLOW_IPS=*
      - ENV=dev
      - GITHUB_PAT_TOKEN=${GITHUB_PAT_TOKEN}
      - DATA_DIR=/data
      - CONTENT_REPO=https://github.com/UNDP-Data/geo-careatlas-notebooks.git

  auth-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: careatlas-proxy
    ports:
      - "4180:4180"
    env_file:
      - .env
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      # CareAtlas checks sessions against /oauth2/auth itself, as on KIND, so nothing is proxied.
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_COOKIE_DOMAINS:
      OAUTH2_PROXY_WHITELIST_DOMAINS: "localhost:4180,localhost:8080,.localhost"
      OAUTH2_PROXY_PROVIDER: "github"
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_KEY}
      OAUTH2_PROXY_GITHUB_ORG: ${OAUTH_ORG_NAME}
      OAUTH2_PROXY_GITHUB_TEAM: ${OAUTH_TEAM_NAME}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_REDIRECT_URL: "http://localhost:4180/oauth2/callback"
      # Access is restricted by GitHub org/team above, matching kind/oauth/values.yaml
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_IPS: "0.0.0.0/0"

volumes:
  careatlas-data:
